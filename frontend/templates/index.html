<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>IVD - 스마트 자산 거래 터미널</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Inter', -apple-system, sans-serif; padding: 30px; margin: 0; }
        .container { width: 95%; max-width: 1700px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; padding-bottom: 25px; margin-bottom: 30px; }
        
        .dashboard-top { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-bottom: 35px; }
        /* 💡 4열에서 지시사항에 맞춰 2열 카드로 격자 축소 정돈 */
        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: border 0.3s; }
        .card p { margin: 0; color: #8b949e; font-size: 14px; font-weight: bold; text-transform: uppercase; }
        .card h2 { margin: 15px 0 0 0; font-size: 38px; color: #ffffff; letter-spacing: -1px; }

        .chart-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .donut-chart { width: 180px; height: 180px; position: relative; border-radius: 50%; }

        table { width: 100%; border-collapse: collapse; background-color: #161b22; border-radius: 12px; overflow: hidden; margin-bottom: 35px; border: 1px solid #30363d; }
        th, td { padding: 18px 25px; border-bottom: 1px solid #30363d; }
        th { background-color: #1f242c; color: #8b949e; font-size: 14px; text-transform: uppercase; }
        
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; }
        .plus { color: #3fb950; }
        .minus { color: #f85149; }
        .text-right { text-align: right; }

        .trade-terminal { background: linear-gradient(145deg, #161b22, #0d1117); border: 2px solid #30363d; border-radius: 16px; padding: 35px; }
        .trade-terminal h3 { margin-top: 0; font-size: 22px; color: #58a6ff; display: flex; align-items: center; gap: 10px; }
        .terminal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .field { display: flex; flex-direction: column; gap: 10px; position: relative; }
        label { font-size: 13px; font-weight: bold; color: #8b949e; }
        input, select { background-color: #010409; border: 1px solid #30363d; border-radius: 8px; color: #ffffff; padding: 14px; font-size: 16px; transition: 0.2s; }
        input:focus { border-color: #58a6ff; outline: none; }

        .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .action-btns button { padding: 18px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; border: none; transition: 0.3s; color: white; }
        .btn-buy { background-color: #238636; }
        .btn-add { background-color: #2ea44f; }
        .btn-sell-part { background-color: #da3633; }
        .btn-sell-all { background-color: #484f58; }
        .action-btns button:hover { opacity: 0.8; transform: translateY(-2px); }

        .autocomplete-suggestions {
            position: absolute; top: 85px; left: 0; right: 0; background-color: #1f242c; border: 1px solid #30363d; border-radius: 8px; z-index: 1000;
            max-height: 250px; overflow-y: auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .suggestion-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
        .suggestion-item:hover { background-color: #388bfd; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-chart-line"></i> IVD SMART TERMINAL</h1>
        <div style="text-align: right;">
            <div id="fx-display" style="font-size: 20px; font-weight: 800; color: #58a6ff; margin-bottom: 5px;">환율: ₩ 0</div>
            <button onclick="loadDashboardData()" style="background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 15px; border-radius: 6px; cursor:pointer;">실시간 동기화</button>
        </div>
    </header>

    <div class="dashboard-top">
        <div class="summary-grid">
            <div class="card">
                <p>총 평가 자산</p>
                <h2 id="total-eval">₩ 0</h2>
            </div>
            <div class="card">
                <p>오늘 확정 실현손익</p>
                <h2 id="realized-profit">₩ 0</h2>
            </div>
        </div>
        <div class="chart-card">
            <p style="margin-bottom: 15px;">포트폴리오 비중</p>
            <div id="donut-box" class="donut-chart"></div>
            <div id="chart-legend" style="margin-top: 15px; font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;"></div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>시장</th>
                <th>종목명 (티커)</th>
                <th class="text-right">보유 수량</th>
                <th class="text-right">평단가</th>
                <th class="text-right">현재가</th>
                <th class="text-right">평가금액 (비중)</th>
                <th class="text-right">수익률 (손익)</th>
            </tr>
        </thead>
        <tbody id="portfolio-table-body"></tbody>
    </table>

    <section class="trade-terminal">
        <h3><i class="fa-solid fa-terminal"></i> 자산 거래 터미널 (Trade Terminal)</h3>
        <div class="terminal-grid">
            <div class="field">
                <label>시장 구분</label>
                <select id="input-market">
                    <option value="KR">KOSPI / KOSDAQ (KR)</option>
                    <option value="US">NASDAQ / NYSE (US)</option>
                </select>
            </div>
            <div class="field">
                <label>종목 검색</label>
                <input type="text" id="input-name" placeholder="종목명 또는 티커" autocomplete="off">
                <div id="suggestions-box" class="autocomplete-suggestions"></div>
            </div>
            <div class="field">
                <label>거래 수량 (주)</label>
                <input type="number" id="input-quantity" placeholder="0">
            </div>
            <div class="field">
                <label>거래 체결 단가 (매수/매도)</label>
                <input type="number" id="input-price" placeholder="₩ / $">
            </div>
        </div>
        <div class="action-btns">
            <button onclick="submitTrading('new_buy')" class="btn-buy">신규 매수</button>
            <button onclick="submitTrading('add_buy')" class="btn-add">추가 매수</button>
            <button onclick="submitTrading('sell_part')" class="btn-sell-part">부분 매도</button>
            <button onclick="submitTrading('sell_all')" class="btn-sell-all">전량 매도</button>
        </div>
    </section>
</div>

<script>
    let selectedSymbol = "";
    const COLORS = ['#58a6ff', '#3fb950', '#f85149', '#d29922', '#bc8cff', '#1f6feb', '#238636'];

    document.addEventListener("DOMContentLoaded", () => {
        loadDashboardData();
        initAutocomplete();
    });

    function toCommas(val) {
        if (val === undefined || val === null || isNaN(val)) return "0";
        return Number(val).toLocaleString();
    }

    function loadDashboardData() {
        fetch("/api/portfolio").then(res => res.json()).then(data => {
            document.getElementById("fx-display").innerText = `환율: ₩ ${toCommas(data.exchange_rate)}`;
            document.getElementById("total-eval").innerText = `₩ ${toCommas(data.total_evaluation)}`;

            // 💡 [매도 정산 가드] 오늘 확정 실현손익 동적 컴포넌트 제어
            const rEl = document.getElementById("realized-profit");
            const oldTag = document.getElementById("realized-rate-tag");
            if (oldTag) oldTag.remove();

            const realizedAmt = data.realized_profit || 0;
            const realizedRate = data.realized_rate || 0.0;
            const realizedCard = rEl.closest('.card');

            if (realizedAmt > 0) {
                rEl.innerText = `₩ ${toCommas(realizedAmt)}`; rEl.className = "plus";
                realizedCard.style.borderTop = "4px solid #3fb950";
                rEl.insertAdjacentHTML('afterend', `<span id="realized-rate-tag" class="plus" style="font-size:14px; font-weight:bold; display:block; margin-top:5px;"><i class="fa-solid fa-caret-up"></i> +${realizedRate}%</span>`);
            } else if (realizedAmt < 0) {
                rEl.innerText = `₩ ${toCommas(realizedAmt)}`; rEl.className = "minus";
                realizedCard.style.borderTop = "4px solid #f85149";
                rEl.insertAdjacentHTML('afterend', `<span id="realized-rate-tag" class="minus" style="font-size:14px; font-weight:bold; display:block; margin-top:5px;"><i class="fa-solid fa-caret-down"></i> ${realizedRate}%</span>`);
            } else {
                rEl.innerText = `₩ 0`; rEl.className = "";
                realizedCard.style.borderTop = "4px solid #58a6ff";
                rEl.insertAdjacentHTML('afterend', `<span id="realized-rate-tag" style="color:#8b949e; font-size:14px; display:block; margin-top:5px;">0.0%</span>`);
            }

            const tbody = document.getElementById("portfolio-table-body");
            tbody.innerHTML = "";
            let chartData = [];

            ["KR", "US"].forEach(m => {
                if (data.portfolio && data.portfolio[m]) {
                    data.portfolio[m].forEach(s => {
                        const tr = document.createElement("tr");
                        const isPlus = s.total_profit_krw >= 0;
                        chartData.push({ name: s.name, weight: s.weight_percent });

                        tr.innerHTML = `
                            <td><b style="color:${s.market==='US'?'#58a6ff':'#ff7b72'}">${s.market}</b></td>
                            <td><b style="color:#ffffff">${s.name}</b><br><span style="color:#8b949e; font-size:12px;">${s.symbol}</span></td>
                            <td class="text-right font-mono">${s.quantity}</td>
                            <td class="text-right font-mono">₩ ${toCommas(s.avg_price)}</td>
                            <td class="text-right font-mono" style="color:#ffffff">₩ ${toCommas(s.current_price)}</td>
                            <td class="text-right font-mono"><b>₩ ${toCommas(s.eval_amount_krw)}</b><br><span style="color:#8b949e; font-size:11px;">(${s.weight_percent}%)</span></td>
                            <td class="text-right font-mono ${isPlus?'plus':'minus'}"><b>${s.total_profit_percent}%</b><br><span>${isPlus?'+':''}${toCommas(s.total_profit_krw)}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            });
            drawChart(chartData);
        });
    }

    function drawChart(items) {
        const box = document.getElementById("donut-box");
        const legend = document.getElementById("chart-legend");
        box.innerHTML = ""; legend.innerHTML = "";
        if (!items || items.length === 0) return;

        let cumulativePercent = 0;
        let svgContent = `<svg viewBox="0 0 32 32" style="transform: rotate(-90deg); border-radius: 50%;"><circle r="16" cx="16" cy="16" fill="#30363d" />`;
        
        items.forEach((item, i) => {
            const color = COLORS[i % COLORS.length];
            const dashArray = `${item.weight} ${100 - item.weight}`;
            const dashOffset = -cumulativePercent;
            svgContent += `<circle r="16" cx="16" cy="16" fill="transparent" stroke="${color}" stroke-width="32" stroke-dasharray="${dashArray}" stroke-dashoffset="${dashOffset}" />`;
            cumulativePercent += item.weight;
            legend.innerHTML += `<span><i class="fa-solid fa-circle" style="color:${color}"></i> ${item.name} (${item.weight}%)</span>`;
        });
        svgContent += `<circle r="11" cx="16" cy="16" fill="#161b22" /></svg>`;
        box.innerHTML = svgContent;
    }

    function initAutocomplete() {
        const nameInput = document.getElementById("input-name");
        const box = document.getElementById("suggestions-box");
        const mkt = document.getElementById("input-market");

        nameInput.addEventListener("input", () => {
            if (nameInput.value.trim().length < 2) { box.style.display="none"; return; }
            fetch(`/api/stock/search?market=${mkt.value}&query=${encodeURIComponent(nameInput.value.trim())}`)
                .then(res => res.json()).then(items => {
                    box.innerHTML = "";
                    items.forEach(item => {
                        const d = document.createElement("div"); d.className = "suggestion-item";
                        d.innerHTML = `${item.name} <span>${item.symbol}</span>`;
                        d.onclick = () => { nameInput.value = item.name; selectedSymbol = item.symbol; box.style.display="none"; };
                        box.appendChild(d);
                    });
                    box.style.display = items.length ? "block" : "none";
                });
        });
    }

    function submitTrading(action) {
        const payload = {
            action, market: document.getElementById("input-market").value,
            name: document.getElementById("input-name").value.trim(),
            symbol: selectedSymbol,
            quantity: parseFloat(document.getElementById("input-quantity").value || 0),
            avg_price: parseFloat(document.getElementById("input-price").value || 0)
        };
        if (!payload.name) return alert("종목을 선택해 주세요.");
        if (action !== 'sell_all' && payload.quantity <= 0) return alert("수량을 정확히 입력해 주세요.");

        fetch("/api/portfolio/save", { 
            method: "POST", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(payload) 
        })
        .then(res => res.json()).then(d => { 
            alert(d.message); 
            document.getElementById("input-name").value = "";
            document.getElementById("input-quantity").value = "";
            document.getElementById("input-price").value = "";
            selectedSymbol = "";
            loadDashboardData(); 
        });
    }
</script>
</body>
</html>
