<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVD - 투자 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <style>
        body { background-color: #0b0f19; color: #cbd5e1; }
    </style>
</head>
<body class="p-4 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-800 pb-3">
            <div>
                <h1 class="text-xl font-bold text-white">📊 IVD 자산 전광판</h1>
            </div>
            <div class="text-xs flex gap-2">
                <span id="fx-display" class="bg-gray-800 px-2 py-1 rounded text-blue-400">환율 로딩 중...</span>
                <button onclick="loadDashboardData()" class="bg-blue-600 text-white px-2 py-1 rounded">새로고침</button>
            </div>
        </header>

        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <p class="text-xs text-gray-400">총 평가 자산</p>
                <p id="total-eval" class="text-lg font-bold text-white mt-1">₩ 0</p>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <p class="text-xs text-gray-400">총 손익액</p>
                <p id="total-profit" class="text-lg font-bold mt-1">₩ 0</p>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <p class="text-xs text-gray-400">총 수익률</p>
                <p id="total-profit-percent" class="text-lg font-bold mt-1">0.0%</p>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <p class="text-xs text-gray-400">오늘의 손익</p>
                <p id="total-today-profit" class="text-lg font-bold mt-1">₩ 0</p>
            </div>
        </section>

        <section class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="bg-gray-800 text-gray-400 border-b border-gray-700">
                            <th class="p-3">시장</th>
                            <th class="p-3">종목명/코드</th>
                            <th class="p-3 text-right">보유량</th>
                            <th class="p-3 text-right">평단가</th>
                            <th class="p-3 text-right">현재가</th>
                            <th class="p-3 text-right">평가금액</th>
                            <th class="p-3 text-right">수익률</th>
                            <th class="p-3 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="portfolio-table-body" class="divide-y divide-gray-800">
                        </tbody>
                </table>
            </div>
        </section>

        <section class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-4">
            <h3 class="text-sm font-semibold text-white">🛠️ 자산 반영 제어반</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                <div>
                    <label class="text-gray-400 block mb-1">시장</label>
                    <select id="input-market" class="w-full bg-gray-800 rounded p-2 text-white border border-gray-700">
                        <option value="KR">국내 주식 (KR)</option>
                        <option value="US">미국 주식 (US)</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 block mb-1">종목명/티커</label>
                    <input type="text" id="input-name" class="w-full bg-gray-800 rounded p-2 text-white border border-gray-700">
                </div>
                <div>
                    <label class="text-gray-400 block mb-1">수량</label>
                    <input type="number" id="input-quantity" class="w-full bg-gray-800 rounded p-2 text-white border border-gray-700">
                </div>
                <div>
                    <label class="text-gray-400 block mb-1">단가</label>
                    <input type="number" id="input-price" class="w-full bg-gray-800 rounded p-2 text-white border border-gray-700">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                <button onclick="submitAction('buy')" class="bg-green-600 text-white py-2 rounded">추가 매수 (+)</button>
                <button onclick="submitAction('sell')" class="bg-red-600 text-white py-2 rounded">부분 매도 (-)</button>
                <button onclick="submitAction('update')" class="bg-blue-600 text-white py-2 rounded">강제 갱신</button>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadDashboardData);

        function numStr(val) {
            if (val === undefined || val === null || isNaN(val)) return "0";
            return Number(val).toLocaleString();
        }

        function loadDashboardData() {
            fetch("/api/portfolio")
                .then(res => res.json())
                .then(data => {
                    const rate = data.exchange_rate || 1350;
                    document.getElementById("fx-display").innerText = "환율: ₩ " + numStr(rate);
                    document.getElementById("total-eval").innerText = "₩ " + numStr(data.total_evaluation);
                    
                    const pEl = document.getElementById("total-profit");
                    pEl.innerText = "₩ " + numStr(data.total_profit);
                    pEl.className = data.total_profit >= 0 ? "text-lg font-bold text-green-400 mt-1" : "text-lg font-bold text-red-400 mt-1";

                    document.getElementById("total-profit-percent").innerText = (data.total_profit_percent || 0) + "%";
                    document.getElementById("total-profit-percent").className = data.total_profit_percent >= 0 ? "text-lg font-bold text-green-400 mt-1" : "text-lg font-bold text-red-400 mt-1";

                    const tEl = document.getElementById("total-today-profit");
                    tEl.innerText = "₩ " + numStr(data.total_today_profit);
                    tEl.className = data.total_today_profit >= 0 ? "text-lg font-bold text-green-400 mt-1" : "text-lg font-bold text-red-400 mt-1";

                    const tbody = document.getElementById("portfolio-table-body");
                    tbody.innerHTML = "";

                    if (data.portfolio) {
                        ["KR", "US"].forEach(m => {
                            if (data.portfolio[m]) {
                                data.portfolio[m].forEach(stock => {
                                    const tr = document.createElement("tr");
                                    const profitClass = (stock.total_profit_krw || 0) >= 0 ? "text-green-400 text-right" : "text-red-400 text-right";
                                    
                                    tr.innerHTML = `
                                        <td class="p-3"><span class="bg-gray-800 px-1 py-0.5 rounded">${stock.market}</span></td>
                                        <td class="p-3 text-white font-medium">${stock.name}<br><span class="text-gray-500 text-xs">${stock.symbol}</span></td>
                                        <td class="p-3 text-right">${stock.quantity}</td>
                                        <td class="p-3 text-right">${numStr(stock.avg_price)}</td>
                                        <td class="p-3 text-right text-gray-300">${numStr(stock.current_price)}</td>
                                        <td class="p-3 text-right text-white">${numStr(stock.eval_amount_krw)} (${stock.weight_percent || 0}%)</td>
                                        <td class="p-3 ${profitClass}">${stock.total_profit_percent}%<br><span class="text-xs">${numStr(stock.total_profit_krw)}</span></td>
                                        <td class="p-3 text-center"><button onclick="deleteStock(${stock.id})" class="text-red-500">삭제</button></td>
                                    `;
                                    tbody.appendChild(tr);
                                });
                            }
                        });
                    }
                }).catch(err => console.error(err));
        }

        function submitAction(actionType) {
            const market = document.getElementById("input-market").value;
            const nameInput = document.getElementById("input-name").value;
            const name = nameInput ? nameInput.trim() : "";
            const quantity = document.getElementById("input-quantity").value;
            const price = document.getElementById("input-price").value;

            if (!name) { alert("종목명을 입력하세요."); return; }

            const payload = {
                action: actionType, market: market, name: name,
                quantity: quantity ? parseFloat(quantity) : 0,
                avg_price: price ? parseFloat(price) : 0
            };

            fetch("/api/portfolio/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.status === "success") {
                    alert(resData.message);
                    document.getElementById("input-name").value = "";
                    document.getElementById("input-quantity").value = "";
                    document.getElementById("input-price").value = "";
                    loadDashboardData();
                } else {
                    alert("실패: " + resData.message);
                }
            }).catch(() => alert("서버 통신 실패"));
        }

        function deleteStock(id) {
            if (!confirm("삭제하시겠습니까?")) return;
            fetch("/api/portfolio/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "delete", id: id })
            })
            .then(res => res.json())
            .then(() => loadDashboardData());
        }
    </script>
</body>
</html>
