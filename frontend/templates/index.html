<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>IVD 자산 관리 시스템 - 대형 전광판</title>
    <style>
        /* 초기 디자인 스타일 계승: 화면 전체를 100% 꽉 채우는 넓고 큼직한 UI */
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 30px; margin: 0; }
        .container { width: 96%; margin: 0 auto; max-width: 1800px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; padding-bottom: 25px; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 32px; color: #ffffff; letter-spacing: -1px; }
        
        .summary-board { display: flex; gap: 25px; margin-bottom: 35px; }
        .card { flex: 1; background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card p { margin: 0; color: #8b949e; font-size: 14px; font-weight: 600; }
        .card h2 { margin: 15px 0 0 0; font-size: 36px; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        table { width: 100%; border-collapse: collapse; background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 35px; overflow: hidden; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background-color: #1f242c; color: #8b949e; font-size: 15px; font-weight: bold; }
        td { font-size: 16px; }
        
        .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-weight: 600; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .plus { color: #3fb950; }
        .minus { color: #f85149; }
        
        .control-panel { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 30px; }
        .control-panel h3 { margin-top: 0; font-size: 20px; color: #ffffff; margin-bottom: 20px; }
        
        .form-group { display: flex; gap: 20px; margin-bottom: 25px; }
        .form-item { flex: 1; display: flex; flex-direction: column; gap: 8px; position: relative; } 
        .form-item label { font-size: 14px; color: #8b949e; font-weight: bold; }
        
        input, select { background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: #58a6ff; outline: none; }
        
        .btn-group { display: flex; gap: 15px; }
        button { border-radius: 6px; padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; border: 1px solid #30363d; color: #ffffff; background-color: #21262d; transition: 0.2s; }
        button:hover { background-color: #30363d; }
        
        .btn-buy { background-color: #238636; border-color: #2ea44f; }
        .btn-buy:hover { background-color: #2ea44f; }
        .btn-sell-part { background-color: #bd403a; border-color: #f85149; }
        .btn-sell-part:hover { background-color: #f85149; }
        .btn-sell-all { background-color: #6e7681; border-color: #8b949e; }
        .btn-sell-all:hover { background-color: #8b949e; }

        /* 자동완성 목록 레이어 */
        .autocomplete-suggestions {
            position: absolute; top: 78px; left: 0; right: 0;
            background-color: #1f242c; border: 1px solid #30363d; border-radius: 6px;
            z-index: 999; max-height: 250px; overflow-y: auto; display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .suggestion-item { padding: 14px; cursor: pointer; font-size: 15px; color: #c9d1d9; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
        .suggestion-item:hover { background-color: #30363d; color: #ffffff; }
        .suggestion-item span { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📊 IVD 대형 자산 포트폴리오 전광판</h1>
            <div>
                <span id="fx-display" style="margin-right: 25px; font-size: 18px; font-weight: bold; color: #58a6ff;">환율: 로딩 중...</span>
                <button onclick="loadDashboardData()" style="padding: 10px 20px; font-size: 14px;">🔄 전체 동기화 새로고침</button>
            </div>
        </header>

        <section class="summary-board">
            <div class="card">
                <p>총 평가 자산</p>
                <h2 id="total-eval">₩ 0</h2>
            </div>
            <div class="card">
                <p>평가 손익액 (미실현)</p>
                <h2 id="total-profit">₩ 0</h2>
            </div>
            <div class="card">
                <p>총 수익률</p>
                <h2 id="total-profit-percent">0.0%</h2>
            </div>
            <div class="card" style="border-left: 4px solid #58a6ff;">
                <p style="color: #58a6ff;">오늘 확정 실현손익</p>
                <h2 id="realized-profit" class="plus">₩ 0</h2>
            </div>
        </section>

        <table>
            <thead>
                <tr>
                    <th>시장</th>
                    <th>종목명 (코드)</th>
                    <th class="text-right">보유량</th>
                    <th class="text-right">평단가</th>
                    <th class="text-right">현재가</th>
                    <th class="text-right">평가금액 (비중)</th>
                    <th class="text-right">수익률 (평가손익)</th>
                    <th class="text-center">인프라 관리</th>
                </tr>
            </thead>
            <tbody id="portfolio-table-body">
                </tbody>
        </table>

        <section class="control-panel">
            <h3>🛠️ 자산 매매 거래 제어반 (원클릭 가중치 자동 계산)</h3>
            <div class="form-group">
                <div class="form-item">
                    <label>시장 구분</label>
                    <select id="input-market">
                        <option value="KR">국내 주식 (KR)</option>
                        <option value="US">미국 주식 (US)</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>종목명 또는 티커</label>
                    <input type="text" id="input-name" placeholder="예: 삼성전자 또는 AAPL" autocomplete="off">
                    <div id="suggestions-box" class="autocomplete-suggestions"></div>
                </div>
                <div class="form-item">
                    <label>수량 (주)</label>
                    <input type="number" id="input-quantity" placeholder="수량 입력">
                </div>
                <div class="form-item">
                    <label>체결/매수 단가 (₩ 또는 $)</label>
                    <input type="number" id="input-price" placeholder="거래 단가 입력">
                </div>
            </div>
            <div class="btn-group">
                <button onclick="submitTrading('new_buy')" class="btn-buy">🆕 신규 매수 (+)</button>
                <button onclick="submitTrading('add_buy')" class="btn-buy">➕ 추가 매수 (+)</button>
                <button onclick="submitTrading('sell_part')" class="btn-sell-part">➖ 부분 매도 (-)</button>
                <button onclick="submitTrading('sell_all')" class="btn-sell-all">🚨 전량 매도 (확정 정산)</button>
            </div>
        </section>
    </div>

    <script>
        let selectedSymbol = ""; // 자동완성용 내부 가드 변수

        document.addEventListener("DOMContentLoaded", function() {
            loadDashboardData();
            initAutocomplete();
        });

        function toCommas(val) {
            if (val === undefined || val === null || isNaN(val)) return "0";
            return Number(val).toLocaleString();
        }

        function loadDashboardData() {
            fetch("/api/portfolio")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("fx-display").innerText = "환율: ₩ " + toCommas(data.exchange_rate);
                    document.getElementById("total-eval").innerText = "₩ " + toCommas(data.total_evaluation);
                    
                    const pEl = document.getElementById("total-profit");
                    pEl.innerText = "₩ " + toCommas(data.total_profit);
                    pEl.className = data.total_profit >= 0 ? "plus" : "minus";

                    const pctEl = document.getElementById("total-profit-percent");
                    pctEl.innerText = (data.total_profit_percent || 0) + "%";
                    pctEl.className = data.total_profit_percent >= 0 ? "plus" : "minus";

                    // 💡 실현손익 출력단 매핑
                    const rEl = document.getElementById("realized-profit");
                    const realized = data.realized_profit || 0;
                    rEl.innerText = "₩ " + toCommas(realized);
                    rEl.className = realized >= 0 ? "plus" : "minus";

                    const tbody = document.getElementById("portfolio-table-body");
                    tbody.innerHTML = "";

                    if (data && data.portfolio) {
                        ["KR", "US"].forEach(m => {
                            if (data.portfolio[m] && Array.isArray(data.portfolio[m])) {
                                data.portfolio[m].forEach(stock => {
                                    const tr = document.createElement("tr");
                                    const totalProfitKrw = stock.total_profit_krw || 0;
                                    const isPlus = totalProfitKrw >= 0;
                                    
                                    // 💡 stock.market 데이터를 타겟해서 매핑하므로 undefined 원천 제거
                                    const mkt = stock.market || m; 

                                    tr.innerHTML = `
                                        <td><strong style="color: ${mkt === 'US' ? '#58a6ff' : '#ff7b72'}">${mkt}</strong></td>
                                        <td><b style="color:#ffffff">${stock.name}</b><br><span style="color:#8b949e; font-size:13px;">${stock.symbol}</span></td>
                                        <td class="text-right font-mono">${stock.quantity}</td>
                                        <td class="text-right font-mono">₩ ${toCommas(stock.avg_price)}</td>
                                        <td class="text-right font-mono" style="color:#c9d1d9">₩ ${toCommas(stock.current_price)}</td>
                                        <td class="text-right font-mono"><b style="color:#ffffff">₩ ${toCommas(stock.eval_amount_krw)}</b><br><span style="color:#8b949e; font-size:12px;">(${stock.weight_percent || 0}%)</span></td>
                                        <td class="text-right font-mono ${isPlus ? 'plus' : 'minus'}"><b>${stock.total_profit_percent}%</b><br><span style="font-size:12px;">${isPlus ? '+' : ''}${toCommas(totalProfitKrw)}</span></td>
                                        <td class="text-center">
                                            <button onclick="quickSellAll('${stock.id}', '${stock.symbol}', '${stock.name}', '${mkt}')" style="color:#f85149; padding:6px 12px; font-size:13px; border:1px solid #444; background:none; cursor:pointer; border-radius:4px;">전량처분</button>
                                        </td>
                                    `;
                                    tbody.appendChild(tr);
                                });
                            }
                        });
                    }
                }).catch(err => console.error("데이터 로드 실패:", err));
        }

        function initAutocomplete() {
            const nameInput = document.getElementById("input-name");
            const box = document.getElementById("suggestions-box");
            const marketSelect = document.getElementById("input-market");

            nameInput.addEventListener("input", function() {
                const query = nameInput.value.trim();
                const market = marketSelect.value;

                if (query.length < 2) {
                    box.innerHTML = "";
                    box.style.display = "none";
                    return;
                }

                fetch(`/api/stock/search?market=${market}&query=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(items => {
                        if (items && items.length > 0) {
                            box.innerHTML = "";
                            items.forEach(item => {
                                const div = document.createElement("div");
                                div.className = "suggestion-item";
                                div.innerHTML = `${item.name} <span>${item.symbol}</span>`;
                                
                                div.addEventListener("click", function() {
                                    nameInput.value = item.name;
                                    selectedSymbol = item.symbol; // 💡 코드 강제 저장하여 미스 매치 차단
                                    box.innerHTML = "";
                                    box.style.display = "none";
                                });
                                box.appendChild(div);
                            });
                            box.style.display = "block";
                        } else {
                            box.style.display = "none";
                        }
                    }).catch(err => console.error("자동완성 에러:", err));
            });

            document.addEventListener("click", function(e) {
                if (e.target !== nameInput) {
                    box.innerHTML = "";
                    box.style.display = "none";
                }
            });
        }

        // 💡 [교정] 신규/추가/부분 매매 전용 통합 파이프라인 (주소 꼬임 방지 및 에러 디버깅 보강)
        function submitTrading(actionType) {
            const market = document.getElementById("input-market").value;
            const nameInput = document.getElementById("input-name").value;
            const name = nameInput ? nameInput.trim() : "";
            const quantity = document.getElementById("input-quantity").value;
            const price = document.getElementById("input-price").value;

            if (!name) { alert("종목명을 입력해 주세요."); return; }
            if (actionType !== 'sell_all' && (!quantity || !price)) { alert("수량과 단가를 정확히 입력해 주세요."); return; }

            const payload = {
                action: actionType, 
                market: market, 
                name: name,
                symbol: selectedSymbol,
                quantity: parseFloat(quantity || 0),
                avg_price: parseFloat(price || 0)
            };

            // 💡 절대경로 /api/portfolio/save 로 명확하게 타격
            fetch("/api/portfolio/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) {
                    // 404, 500 등 HTTP 에러 발생 시 에러 코드를 포함하여 던짐
                    throw new Error(`HTTP 상태 에러: ${res.status}`);
                }
                return res.json();
            })
            .then(resData => {
                if (resData.status === "success") {
                    alert(resData.message);
                    // 인풋 폼 청소
                    document.getElementById("input-name").value = "";
                    document.getElementById("input-quantity").value = "";
                    document.getElementById("input-price").value = "";
                    selectedSymbol = "";
                    loadDashboardData();
                } else {
                    alert("매매 실패: " + resData.message);
                }
            })
            .catch(err => {
                // 💡 "서버통신실패" 퉁치지 않고 진짜 원인을 alert로 출력
                alert(`통신 실패 원인: ${err.message}\n(주소가 틀렸거나 백엔드 내부 로직에서 크래시가 났을 수 있습니다.)`);
                console.error("상세 에러 로그:", err);
            });
        }

        // 리스트 내부에서 원클릭 전량 처분 기능 주소 교정
        function quickSellAll(id, symbol, name, market) {
            if (!confirm(`[${name}] 종목을 시장가 전량 매도 및 실현손익 확정하시겠습니까?`)) return;
            
            fetch("/api/portfolio/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "sell_all", id: id, symbol: symbol, name: name, market: market })
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP 상태 에러: ${res.status}`);
                return res.json();
            })
            .then(resData => {
                alert(resData.message);
                loadDashboardData();
            })
            .catch(err => {
                alert(`서버 통신 실패: ${err.message}`);
            });
        }

        // 리스트 내부에서 원클릭 전량 처분 기능
        function quickSellAll(id, symbol, name, market) {
            if (!confirm(`[${name}] 종목을 시장가 전량 매도 및 실현손익 확정하시겠습니까?`)) return;
            fetch("/api/portfolio/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "sell_all", id: id, symbol: symbol, name: name, market: market })
            })
            .then(res => res.json())
            .then(resData => {
                alert(resData.message);
                loadDashboardData();
            });
        }
    </script>
</body>
</html>
