<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVESTMENT DASHBOARD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-white: #f0f6fc;
            --lime-green: #deff9a;
            --plus-color: #3fb950;
            --minus-color: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Urbanist', sans-serif;
            padding: 25px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-white);
        }
        .header h1 span { color: var(--lime-green); }
        .fx-rate { font-family: 'JetBrains Mono', monospace; color: #8b949e; font-size: 14px; }

        .summary-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 18px;
        }
        .card-title { font-size: 13px; color: #8b949e; margin-bottom: 4px; font-weight: 500; }
        .card-value { font-size: 24px; font-weight: 700; color: var(--text-white); }
        .card-rate-tag { font-size: 13px; font-weight: bold; margin-top: 2px; display: block; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .dashboard-body {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .section-title {
            font-size: 18px;
            color: var(--text-white);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title span { font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: bold; }
        .badge-kr { background-color: rgba(255, 123, 114, 0.15); color: #ff7b72; }
        .badge-us { background-color: rgba(88, 166, 255, 0.15); color: #58a6ff; }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(0,0,0,0.15); padding: 10px 14px; color: #8b949e; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        td { padding: 11px 14px; border-bottom: 1px solid rgba(48, 54, 61, 0.4); color: var(--text-white); font-size: 14px; }
        .text-right { text-align: right; }
        .plus { color: var(--plus-color) !important; }
        .minus { color: var(--minus-color) !important; }

        .panel-title { font-size: 16px; color: var(--text-white); margin-bottom: 15px; font-weight: 700; }
        .tx-toggle-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tx-btn {
            padding: 10px; border: 1px solid var(--border-color); background: #0d1117;
            color: #8b949e; font-weight: bold; font-size: 14px; border-radius: 6px; cursor: pointer; text-align: center;
        }
        .tx-btn.active-buy { background: rgba(63, 185, 80, 0.15); color: var(--plus-color); border-color: var(--plus-color); }
        .tx-btn.active-sell { background: rgba(248, 81, 73, 0.15); color: var(--minus-color); border-color: var(--minus-color); }

        .form-group { margin-bottom: 12px; position: relative; }
        label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
        input, select {
            width: 100%; background-color: #0d1117; border: 1px solid var(--border-color);
            border-radius: 6px; padding: 8px 10px; color: var(--text-white); font-size: 13px;
        }
        input:focus, select:focus { border-color: var(--lime-green); outline: none; }
        
        .btn-submit {
            width: 100%; color: #000; border: none;
            border-radius: 6px; padding: 11px; font-weight: 700; cursor: pointer; margin-top: 5px; font-size: 14px;
        }
        .btn-buy-mode { background-color: var(--plus-color); color: white; }
        .btn-sell-mode { background-color: var(--minus-color); color: white; }

        .autocomplete-box {
            position: absolute; top: 100%; left: 0; right: 0; background-color: #1f242c;
            border: 1px solid var(--border-color); border-radius: 6px; z-index: 99; max-height: 180px;
            overflow-y: auto;
        }
        .autocomplete-item { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid rgba(48,54,61,0.3); font-size: 13px; }
        .autocomplete-item:hover { background-color: rgba(222, 255, 154, 0.1); color: var(--lime-green); }
        
        #portfolio-chart { width: 100%; height: 200px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>INVESTMENT <span>DASHBOARD</span></h1>
        <div id="fx-display" class="fx-rate">환율: ₩ --</div>
    </div>

    <div class="summary-container">
        <div class="card" style="border-top: 3px solid var(--plus-color);">
            <div class="card-title">원화 평가 자산 (KRW)</div>
            <div id="total-eval-krw" class="card-value font-mono">₩ 0</div>
            <span id="rate-krw" class="card-rate-tag">0.00%</span>
        </div>
        <div class="card" style="border-top: 3px solid #58a6ff;">
            <div class="card-title">달러 평가 자산 (USD)</div>
            <div id="total-eval-usd" class="card-value font-mono">$ 0.00</div>
            <span id="rate-usd" class="card-rate-tag">0.00%</span>
            <span id="total-eval-usd-converted" style="color:#8b949e; font-size:11px; display:block; margin-top:2px;">(₩ 0)</span>
        </div>
        <div class="card" style="border-top: 3px solid var(--lime-green); padding: 5px 12px;">
            <div id="portfolio-chart"></div>
        </div>
    </div>

    <div class="dashboard-body">
        <div>
            <div class="section-title">원화 종목 <span class="badge-kr">₩ KRW</span></div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>종목명/코드</th>
                            <th class="text-right">보유수량</th>
                            <th class="text-right">평단</th>
                            <th class="text-right">현재가</th>
                            <th class="text-right">평가금액</th>
                            <th class="text-right">수익률</th>
                        </tr>
                    </thead>
                    <tbody id="kr-table-body"></tbody>
                </table>
            </div>

            <div class="section-title">달러 종목 <span class="badge-us">$ USD</span></div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>종목명/코드</th>
                            <th class="text-right">보유수량</th>
                            <th class="text-right">평단</th>
                            <th class="text-right">현재가</th>
                            <th class="text-right">평가금액</th>
                            <th class="text-right">수익률</th>
                        </tr>
                    </thead>
                    <tbody id="us-table-body"></tbody>
                </table>
            </div>
        </div>

        <div>
            <div class="card">
                <div class="panel-title"><i class="fa-solid fa-pen-to-square"></i> 자산 업데이트</div>
                
                <div class="tx-toggle-container">
                    <div id="tx-buy-btn" class="tx-btn active-buy" onclick="setTxType('BUY')">매수 (추가)</div>
                    <div id="tx-sell-btn" class="tx-btn" onclick="setTxType('SELL')">매도 (경감)</div>
                </div>

                <form id="asset-form">
                    <input type="hidden" id="asset-tx-type" value="BUY">
                    
                    <div class="form-group">
                        <label>시장 구분</label>
                        <select id="asset-market" onchange="clearSearch()">
                            <option value="KR">한국 시장 (KRW)</option>
                            <option value="US">미국 시장 (USD)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>종목 검색</label>
                        <input type="text" id="asset-query" placeholder="종목명 또는 티커 입력..." autocomplete="off">
                        <div id="search-results" class="autocomplete-box"></div>
                    </div>
                    <div class="form-group">
                        <label>선택된 심볼</label>
                        <input type="text" id="asset-symbol" readonly style="background-color:rgba(0,0,0,0.2); color:#8b949e;">
                        <input type="hidden" id="asset-name">
                    </div>
                    <div class="form-group">
                        <label id="label-qty">매수 수량</label>
                        <input type="number" id="asset-qty" step="any" placeholder="0.0" required>
                    </div>
                    
                    <div class="form-group" id="price-form-group">
                        <label id="label-price">매수 단가</label>
                        <input type="number" id="asset-price" step="any" placeholder="0.0" required>
                    </div>
                    <button type="submit" id="submit-btn" class="btn-submit btn-buy-mode">매수 반영하기</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        let currentTxType = "BUY";

        // 💡 v1.1.1 매수/매도 단가 전환 토글 컨트롤러
        function setTxType(type) {
            currentTxType = type;
            document.getElementById("asset-tx-type").value = type;
            
            const buyBtn = document.getElementById("tx-buy-btn");
            const sellBtn = document.getElementById("tx-sell-btn");
            const submitBtn = document.getElementById("submit-btn");
            const labelPrice = document.getElementById("label-price");

            if (type === "BUY") {
                buyBtn.className = "tx-btn active-buy";
                sellBtn.className = "tx-btn";
                document.getElementById("label-qty").innerText = "매수 수량";
                labelPrice.innerText = "매수 단가"; // '매수 평단가' -> '매수 단가' 교정
                submitBtn.innerText = "매수 반영하기";
                submitBtn.className = "btn-submit btn-buy-mode";
            } else {
                buyBtn.className = "tx-btn";
                sellBtn.className = "tx-btn active-sell";
                document.getElementById("label-qty").innerText = "매도 수량";
                labelPrice.innerText = "매도 단가"; // 💡 매도 시 '매도 단가' 입력 필드 활성화
                submitBtn.innerText = "매도 차감하기";
                submitBtn.className = "btn-submit btn-sell-mode";
            }
        }

        function toCommas(v) {
            if (v === undefined || v === null) return "0";
            const num = parseFloat(v);
            if (isNaN(num)) return v.toString();
            return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }

        function clearSearch() {
            document.getElementById("asset-query").value = "";
            document.getElementById("asset-symbol").value = "";
            document.getElementById("asset-name").value = "";
        }

        let chartInstance = null;
        function drawChart(chartData) {
            const options = {
                series: chartData.map(c => c.weight),
                labels: chartData.map(c => c.name),
                chart: { type: 'donut', height: 200 },
                stroke: { show: false },
                legend: { show: false },
                dataLabels: { enabled: true, style: { fontSize: '10px' } }
            };
            if(chartInstance) chartInstance.destroy();
            chartInstance = new ApexCharts(document.querySelector("#portfolio-chart"), options);
            chartInstance.render();
        }

        function loadDashboardData() {
            fetch("/api/portfolio").then(res => res.json()).then(data => {
                document.getElementById("fx-display").innerText = `환율: ₩ ${toCommas(data.exchange_rate)}`;
                document.getElementById("total-eval-krw").innerText = `₩ ${toCommas(data.total_evaluation_krw)}`;
                document.getElementById("total-eval-usd").innerText = `$ ${data.total_evaluation_usd.toFixed(2)}`;
                
                const rKrw = document.getElementById("rate-krw");
                rKrw.innerText = `${data.profit_rate_krw >= 0 ? '+' : ''}${data.profit_rate_krw}%`;
                rKrw.className = `card-rate-tag ${data.profit_rate_krw >= 0 ? 'plus' : 'minus'}`;

                const rUsd = document.getElementById("rate-usd");
                rUsd.innerText = `${data.profit_rate_usd >= 0 ? '+' : ''}${data.profit_rate_usd}%`;
                rUsd.className = `card-rate-tag ${data.profit_rate_usd >= 0 ? 'plus' : 'minus'}`;

                const usdToKrw = Math.round(data.total_evaluation_usd * data.exchange_rate);
                document.getElementById("total-eval-usd-converted").innerText = `(₩ ${toCommas(usdToKrw)})`;

                const krTbody = document.getElementById("kr-table-body");
                const usTbody = document.getElementById("us-table-body");
                krTbody.innerHTML = ""; usTbody.innerHTML = "";
                
                let chartData = [];
                const fx = data.exchange_rate || 1350.0;

                if (data.portfolio && data.portfolio["KR"]) {
                    data.portfolio["KR"].forEach(s => {
                        chartData.push({ name: s.name, weight: s.weight_percent });
                        const tr = document.createElement("tr");
                        const isPlus = s.total_profit >= 0;
                        tr.innerHTML = `
                            <td><b>${s.name}</b><br><span style="color:#8b949e; font-size:12px;">${s.symbol}</span></td>
                            <td class="text-right font-mono">${s.quantity}</td>
                            <td class="text-right font-mono">₩ ${toCommas(s.avg_price)}</td>
                            <td class="text-right font-mono">₩ ${toCommas(s.current_price)}</td>
                            <td class="text-right font-mono"><b>₩ ${toCommas(s.eval_amount)}</b><br><span style="color:#8b949e; font-size:11px;">(${s.weight_percent}%)</span></td>
                            <td class="text-right font-mono ${isPlus?'plus':'minus'}"><b>${s.total_profit_percent}%</b><br><span>${isPlus?'+':''}₩ ${toCommas(s.total_profit)}</span></td>
                        `;
                        krTbody.appendChild(tr);
                    });
                }

                if (data.portfolio && data.portfolio["US"]) {
                    data.portfolio["US"].forEach(s => {
                        chartData.push({ name: s.name, weight: s.weight_percent });
                        const tr = document.createElement("tr");
                        const isPlus = s.total_profit >= 0;
                        const evalKrw = Math.round(s.eval_amount * fx);
                        const profitKrw = Math.round(s.total_profit * fx);

                        tr.innerHTML = `
                            <td><b>${s.name}</b><br><span style="color:#8b949e; font-size:12px;">${s.symbol}</span></td>
                            <td class="text-right font-mono">${s.quantity}</td>
                            <td class="text-right font-mono">$ ${s.avg_price.toFixed(2)}</td>
                            <td class="text-right font-mono">$ ${s.current_price.toFixed(2)}</td>
                            <td class="text-right font-mono"><b>$ ${toCommas(s.eval_amount)}</b><br><span style="color:#8b949e; font-size:11px;">(₩ ${toCommas(evalKrw)})</span></td>
                            <td class="text-right font-mono ${isPlus?'plus':'minus'}"><b>${s.total_profit_percent}%</b><br><span>${isPlus?'+':''}$ ${toCommas(s.total_profit)}</span><br><span style="font-size:11px; color:${isPlus?'#3fb950':'#f85149'}">(₩ ${toCommas(profitKrw)})</span></td>
                        `;
                        usTbody.appendChild(tr);
                    });
                }
                drawChart(chartData);
            });
        }

        const qInput = document.getElementById("asset-query");
        const rBox = document.getElementById("search-results");

        qInput.addEventListener("input", function() {
            const m = document.getElementById("asset-market").value;
            const q = this.value.trim();
            if(!q) { rBox.style.display = "none"; return; }

            fetch(`/api/stock/search?market=${m}&query=${encodeURIComponent(q)}`)
                .then(res => res.json()).then(items => {
                    if(!items || items.length === 0) { rBox.style.display = "none"; return; }
                    rBox.innerHTML = "";
                    items.forEach(item => {
                        const div = document.createElement("div");
                        div.className = "autocomplete-item";
                        div.innerHTML = `<b>${item.symbol}</b> - ${item.name}`;
                        div.addEventListener("click", () => {
                            document.getElementById("asset-symbol").value = item.symbol;
                            document.getElementById("asset-name").value = item.name;
                            qInput.value = item.name;
                            rBox.style.display = "none";
                        });
                        rBox.appendChild(div);
                    });
                    rBox.style.display = "block";
                });
        });

        document.getElementById("asset-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const payload = {
                tx_type: document.getElementById("asset-tx-type").value,
                market: document.getElementById("asset-market").value,
                symbol: document.getElementById("asset-symbol").value,
                name: document.getElementById("asset-name").value,
                quantity: parseFloat(document.getElementById("asset-qty").value || 0),
                avg_price: parseFloat(document.getElementById("asset-price").value || 0)
            };

            fetch("/api/portfolio/save", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(resData => {
                if(resData.status === "success") {
                    this.reset();
                    setTxType("BUY");
                    clearSearch();
                    loadDashboardData();
                } else { alert("반영 실패: " + resData.message); }
            });
        });

        document.addEventListener("DOMContentLoaded", loadDashboardData);
    </script>
</body>
</html>
